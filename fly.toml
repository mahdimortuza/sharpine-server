# fly.toml app configuration file generated for sharpine-server on 2026-01-07T07:17:52+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sharpine-server'
primary_region = 'sin'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1


[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
